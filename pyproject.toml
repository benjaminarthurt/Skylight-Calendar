[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skylight-calendar"
version = "0.1.0"
description = "Unofficial Python client for the Skylight family calendar (app.ourskylight.com): calendar, profiles, lists, chores, rewards and meals."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ben" }]
keywords = ["skylight", "calendar", "family", "home-assistant", "api-client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "build"]

[project.scripts]
skylight = "skylight_calendar.cli:main"

[project.urls]
Homepage = "https://github.com/benjaminarthurt/Skylight-Calendar"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skylight_calendar = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
